name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 spells violinplot's orientation `vert=`, 3.11 renamed it and deprecates the old
        # name. Consumer projects run both, so both are tested.
        matplotlib: ["3.10.*", "3.11.*"]
    steps:
      # Pinned to FLOATING major tags, so patches arrive without anyone remembering. The version
      # that matters is the Node runtime the action declares: both v7 tags declare node24. (The
      # pins WERE checkout v4 and setup-uv v5, which declare node20 — deprecated, and force-run on
      # node24 with a warning; when that force is withdrawn a workflow on them stops starting, and
      # the error reads like a repo problem rather than two version numbers.)
      #
      # setup-uv is held at v7 rather than a newer major on purpose: from v8 on it publishes no
      # bare major tag, so anything past v7 has to be pinned exactly and then bumped by hand —
      # which is the same slow rot in a different coat. Nothing here uses what the later majors
      # added.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # One cache per matrix leg. v7 caches by default where v5 did not, and the key is derived
          # from the lockfile — which is identical across the legs, so both raced for the same entry
          # and one lost it every run: "Unable to reserve cache ... another job may be creating
          # this cache". The legs are not interchangeable anyway; each installs a different
          # matplotlib on top of that lockfile, so they want separate caches on the merits.
          cache-suffix: matplotlib-${{ matrix.matplotlib }}
      - run: uv sync --extra dev
      - run: uv pip install "matplotlib==${{ matrix.matplotlib }}"
      # One command, defined in the justfile, so this file cannot check less than the developer
      # does. It listed its own steps until 2026-08-07, and had drifted to linting one directory of
      # the two, typechecking nothing at all, and running a stricter pytest than `just` did.
      - run: uv run just ci
