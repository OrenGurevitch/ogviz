name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 spells violinplot's orientation `vert=`, 3.11 renamed it and deprecates the old
        # name. Consumer projects run both, so both are tested.
        matplotlib: ["3.10.*", "3.11.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv pip install "matplotlib==${{ matrix.matplotlib }}"
      - run: uv run ruff check ogviz
      - run: uv run ruff format --check ogviz
      - name: fail on a deprecation, so a matplotlib rename is caught before it breaks
        run: uv run pytest ogviz -q -W error::DeprecationWarning
