name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 spells violinplot's orientation `vert=`, 3.11 renamed it and deprecates the old
        # name. Consumer projects run both, so both are tested.
        matplotlib: ["3.10.*", "3.11.*"]
    steps:
      # Pinned to FLOATING major tags, so patches arrive without anyone remembering. The version
      # that matters is the Node runtime the action declares: checkout v4 and setup-uv v5 both
      # declare node20, which GitHub has deprecated and is currently force-running on node24 while
      # printing a warning. When that force is withdrawn the workflow stops starting, and the error
      # reads like a repo problem rather than two version numbers.
      #
      # setup-uv is held at v7 rather than the newer v9 on purpose: it stops publishing a bare `v9`
      # major tag, so anything past v7 has to be pinned exactly and then bumped by hand — which is
      # the same slow rot in a different coat. v7 already declares node24, and nothing here uses
      # what the later majors added.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # One cache per matrix leg. v7 caches by default where v5 did not, and the key is derived
          # from the lockfile — which is identical across the legs, so both raced for the same entry
          # and one lost it every run: "Unable to reserve cache ... another job may be creating
          # this cache". The legs are not interchangeable anyway; each installs a different
          # matplotlib on top of that lockfile, so they want separate caches on the merits.
          cache-suffix: matplotlib-${{ matrix.matplotlib }}
      - run: uv sync --extra dev
      - run: uv pip install "matplotlib==${{ matrix.matplotlib }}"
      - run: uv run ruff check ogviz
      - run: uv run ruff format --check ogviz
      - name: fail on a deprecation, so a matplotlib rename is caught before it breaks
        run: uv run pytest ogviz -q -W error::DeprecationWarning
