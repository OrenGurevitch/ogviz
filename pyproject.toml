[project]
name = "ogviz"
version = "0.1.0"
description = "Publication figure primitives — one house style, one violin, one significance bracket, shared across projects."
requires-python = ">=3.12"
dependencies = [
    # 3.10, not 3.9: `Axes.get_figure(root=True)` — which `wrap_to_panel` needs to resolve a
    # SubFigure to its parent — gained that argument in 3.10, and on 3.9 the call raises TypeError
    # from inside a layout helper. The floor said 3.9 while the code could not run there, so a
    # consumer on 3.9 met a crash where they should have met a resolver error. CI tests 3.10 and
    # 3.11, and the floor now matches what is actually tested.
    "matplotlib>=3.10",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["basedpyright>=1.31", "pytest>=8", "ruff>=0.6", "rust-just>=1.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ogviz"]
# The tests live INSIDE the package, so they shipped with it: 37 of the wheel's 90 files, 41% of
# what a consumer installs, and not one of them importable there — `pytest` is a dev extra, and the
# autouse `house_style` fixture is in a root `conftest.py` that was never in the wheel to begin
# with. `import ogviz.qc.test` raised ModuleNotFoundError in a clean consumer environment.
#
# The same reasoning that put `conftest.py` at the root ("the package is what the wheel ships")
# is the reason these do not belong in it. `pyproject.toml`'s `testpaths` still collects them from
# the source tree, which is where they are meant to run.
exclude = ["**/test.py", "**/test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TC", "N"]

[tool.pytest.ini_options]
testpaths = ["ogviz"]
python_files = ["test.py", "test_*.py"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Tests are excluded on purpose: they poke matplotlib internals (collections[0].get_paths()[0]
# .vertices) where the stubs are weakest, so checking them reports stub noise and no defects.
# pytest is what catches bugs in a test. SHIPPED code is checked strictly.
exclude = [".venv", "**/__pycache__", "examples/out", "ogviz/**/test*.py"]

[dependency-groups]
dev = [
    "pypatree",
]
